name = "Amp"
category = "agent"
description = "Sourcegraph's coding agent (`amp`)"
icon = "amp.svg"
icon_color = "#2C3A2A"
os = ["debian", "ubuntu"]
requires = ["node"]
# Amp talks to its own service, which brokers the models; AMP_API_KEY signs in
allow = ["ampcode.com"]
# Sign in with `amp login` in a session, or set AMP_API_KEY (an sgamp_ token from ampcode.com settings) as an environment variable; the docs do not say how the token is sent, so it is not a managed credential.
command = "amp"
task = "amp --dangerously-allow-all -x {prompt}"
install = '''
sudo npm install -g --no-fund --no-audit @sourcegraph/amp
amp --version
'''
