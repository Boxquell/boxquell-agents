name = "Amp"
category = "agent"
description = "Sourcegraph's coding agent (`amp`)"
icon = "amp.svg"
icon_color = "#2C3A2A"
os = ["debian", "ubuntu"]
requires = ["node"]
# Amp talks to its own service, which brokers the models; AMP_API_KEY signs in
allow = ["ampcode.com"]
secrets = ["amp"]
command = "amp"
task = "amp --dangerously-allow-all -x {prompt}"
install = '''
sudo npm install -g --no-fund --no-audit @sourcegraph/amp
amp --version
'''

[[credential]]
name = "amp"
label = "Amp access token"
help = "An access token for Amp, used to sign in without a browser."
url = "https://ampcode.com/settings"
hosts = ["ampcode.com"]
env = ["AMP_API_KEY"]
