name = "goose"
category = "agent"
description = "Block's open-source coding agent for many providers (`goose`)"
icon = "goose.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
# the release is a .tar.bz2, so bzip2 comes from the system packages
install_allow = ["@packages", "github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
allow = ["api.anthropic.com", "api.openai.com", "openrouter.ai"]
secrets = ["anthropic", "openai", "openrouter"]
model_env = "GOOSE_MODEL"
command = "goose"
task = "GOOSE_MODE=auto goose run -t {prompt}"
install = '''
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends bzip2
curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | sudo env GOOSE_BIN_DIR=/usr/local/bin CONFIGURE=false bash
goose --version
'''

[[credential]]
name = "anthropic"
label = "Anthropic API key"
help = "An API key from the Anthropic Console."
url = "https://console.anthropic.com/settings/keys"

[[credential]]
name = "openai"
label = "OpenAI API key"
help = "An API key from the OpenAI platform."
url = "https://platform.openai.com/api-keys"

[[credential]]
name = "openrouter"
label = "OpenRouter API key"
help = "An API key from OpenRouter."
url = "https://openrouter.ai/keys"

[[config]]
env = "GOOSE_PROVIDER"
label = "Provider"
help = "The model provider goose uses."
options = ["anthropic", "openai", "openrouter"]

[[config]]
env = "GOOSE_MODE"
label = "Approval mode"
help = "How goose asks before it acts."
kind = "choice"
options = ["auto", "approve", "smart_approve"]
placeholder = "auto"

[[config]]
env = "GOOSE_MAX_TURNS"
label = "Max turns"
help = "How many steps goose may take before it asks you."
kind = "number"
placeholder = "1000"

[[config]]
env = "GOOSE_TEMPERATURE"
label = "Temperature"
help = "Randomness of replies, from 0.0 to 1.0."
kind = "number"
placeholder = "The model's default"

[[config]]
env = "GOOSE_CLI_THEME"
label = "Color theme"
help = "The colors goose uses in the terminal."
kind = "choice"
options = ["light", "dark", "ansi"]
placeholder = "ansi"
