name = "Claude Code"
category = "agent"
description = "Anthropic's coding agent (`claude`)"
icon = "claude.svg"
icon_color = "#D97757"
os = ["debian", "ubuntu"]
requires = ["node"]
allow = ["api.anthropic.com"]
secrets = ["anthropic", "claude-oauth"]
model_env = "ANTHROPIC_MODEL"
command = "claude"
install = '''
sudo npm install -g --no-fund --no-audit @anthropic-ai/claude-code
claude --version
'''
[env]
DISABLE_AUTOUPDATER = "1"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
