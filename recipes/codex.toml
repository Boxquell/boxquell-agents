name = "Codex"
category = "agent"
description = "OpenAI's coding agent (`codex`)"
icon = "codex.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
requires = ["node"]
allow = ["api.openai.com"]
secrets = ["openai"]
command = "codex"
task = "codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check {prompt}"
install = '''
sudo npm install -g --no-fund --no-audit @openai/codex
codex --version
'''

[[credential]]
name = "openai"
label = "OpenAI API key"
help = "An API key from the OpenAI platform."
url = "https://platform.openai.com/api-keys"
