name = "Gemini CLI"
category = "agent"
description = "Google's coding agent (`gemini`)"
icon = "googlegemini.svg"
icon_color = "#8E75B2"
os = ["debian", "ubuntu"]
requires = ["node"]
# generativelanguage.googleapis.com serves the Gemini API (GEMINI_API_KEY)
allow = ["generativelanguage.googleapis.com"]
secrets = ["gemini"]
model_env = "GEMINI_MODEL"
command = "gemini"
task = "gemini --approval-mode=yolo -p {prompt}"
install = '''
sudo npm install -g --no-fund --no-audit @google/gemini-cli
gemini --version
'''

[[credential]]
name = "gemini"
label = "Gemini API key"
help = "An API key from Google AI Studio."
url = "https://aistudio.google.com/app/apikey"
hosts = ["generativelanguage.googleapis.com"]
env = ["GEMINI_API_KEY"]

[[config]]
env = "GOOGLE_GEMINI_BASE_URL"
label = "API endpoint"
help = "Send Gemini API requests through a proxy or gateway."
placeholder = "Google's Gemini API"
