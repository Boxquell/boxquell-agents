name = "opencode"
category = "agent"
description = "Open-source coding agent for many providers (`opencode`)"
icon = "opencode.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
requires = ["node"]
allow = ["models.dev", "opencode.ai", "api.anthropic.com", "api.openai.com", "openrouter.ai"]
secrets = ["anthropic", "openai", "openrouter"]
command = "opencode"
task = "opencode run {prompt}"
install = '''
sudo npm install -g --no-fund --no-audit opencode-ai
opencode --version
'''

[[credential]]
name = "anthropic"
label = "Anthropic API key"
help = "An API key from the Anthropic Console."
url = "https://console.anthropic.com/settings/keys"

[[credential]]
name = "openai"
label = "OpenAI API key"
help = "An API key from the OpenAI platform."
url = "https://platform.openai.com/api-keys"

[[credential]]
name = "openrouter"
label = "OpenRouter API key"
help = "An API key from OpenRouter."
url = "https://openrouter.ai/keys"
